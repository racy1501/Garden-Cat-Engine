<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="wall_art_locked">
  <!-- wall_art_locked · 挂画 · 未购买覆盖层
       基准：与满配母图完全一致 —— 1536x1024，同一坐标系（坐标原点都在左上角）。
       接法：叠在母图之上；cottage.items 里没有该购买项 -> 显示本层；已有 -> 隐藏（display:none）。
       除这件家具所在区域外，其余像素完全透明。 -->
  <title>wall_art_locked</title>
  <!-- ① 压暗 + 灰化 + 去饱和：半透明灰层，原图细节仍隐约可见 -->
  <path d="M 1357 337.3 L 1409 357.1 L 1409 419.3 L 1386 414.1 L 1357 401.1Z M 1336 411.3 L 1393 432.1 L 1392.1 493.5 L 1336 470Z" fill="#44443F" fill-opacity="0.72"/>
  <!-- ② 柔和卡其色边线（外轮廓正向 + 内轮廓反向绕序，nonzero 只留中间那圈） -->
  <path d="M 1352 330.1 L 1414 353.6 L 1414 425.5 L 1384.4 418.9 L 1352 404.3Z M 1331 404.1 L 1398 428.6 L 1397 501 L 1331 473.3Z M 1357 401.1 L 1386 414.1 L 1409 419.3 L 1409 357.1 L 1357 337.3Z M 1336 470 L 1392.1 493.5 L 1393 432.1 L 1336 411.3Z" fill="#D9C79C"/>
</svg>
